name: Studio release builds

# Builds the Patent Creator Studio installers on GitHub's own Mac and Windows
# machines and attaches them to the release for the tag, so every release
# carries Mac and Windows builds made from the same commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and attach to (for example v0.1.0-beta.3)'
        required: true

permissions:
  contents: write

concurrency:
  group: studio-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  tools-current:
    # Studio carries its own copy of the patent tools and installs that copy
    # on testers' computers. A release built while that copy is behind the
    # public Claude-Patent-Creator would hand testers old checks, so the build
    # waits until every public commit is merged in (the weekly sync workflow
    # opens that merge as a pull request).
    name: Patent tools include every public fix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Compare with the public repository
        run: |
          git fetch -q https://github.com/RobThePCGuy/Claude-Patent-Creator.git main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Every public commit is in this release."
            exit 0
          fi
          echo "::error::This release is missing $(git rev-list --count HEAD..FETCH_HEAD) commit(s) from Claude-Patent-Creator main. Merge them (or the sync pull request) first, then tag again."
          git log --oneline HEAD..FETCH_HEAD | head -20
          exit 1

  build:
    name: Build (${{ matrix.os }})
    needs: tools-current
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: 'studio/dist/*.zip'
          - os: windows-latest
            script: dist:win
            # The installer only, not the uninstaller electron-builder leaves beside it.
            files: 'studio/dist/*Setup*[0-9].exe'
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Install
        working-directory: studio
        run: npm ci

      - name: Build
        working-directory: studio
        # On a tag in CI electron-builder would try to publish by itself; this
        # workflow does the uploading, so the builder never publishes.
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Make sure the release exists
        shell: bash
        run: |
          # Both jobs may get here at once; whichever loses the create finds it made.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --verify-tag --title "$TAG" --notes "Builds for $TAG." || \
            gh release view "$TAG" >/dev/null

      - name: Attach the installers
        shell: bash
        run: gh release upload "$TAG" ${{ matrix.files }} --clobber
