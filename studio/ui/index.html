<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Patent Creator Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand drag">
        <div class="mark">§</div>
        <div>
          <div class="brand-name">Patent Creator</div>
          <div class="brand-sub">Studio</div>
        </div>
      </div>
      <button id="new-btn" class="btn primary wide">New invention</button>
      <nav id="project-list" aria-label="Inventions"></nav>
      <div class="side-foot">
        <div id="update-notice" class="small" role="status"></div>
        <button class="navlink" data-view="setup"><span class="dot" id="setup-dot"></span>Setup</button>
        <button class="navlink" data-view="settings">Settings</button>
        <button class="navlink" data-view="help">Costs and legal help</button>
      </div>
    </aside>
    <main id="main"></main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
